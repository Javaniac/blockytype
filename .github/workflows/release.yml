name: Release

# Stable build: pushing a tag like v1.0.0 builds the jar and publishes a GitHub Release.
# Tags with a suffix (v1.1.0-rc1) are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version from tag
        run: echo "BT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew --no-daemon test jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/libs/blockytype-*.jar \
            --title "BlockyType $BT_VERSION" --generate-notes $flags
